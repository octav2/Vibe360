    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Vibe360 Event Hire Buckinghamshire</title>
    <meta name="description" content="Contact Vibe360 for corporate enquiries, custom packages, or venue questions. We serve Buckinghamshire and the Home Counties.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" defer></script>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg">
</head>
<body>
    <div id="site-header"></div>

    

    <div class="legal-container">
        <div class="card">
            <h1>Get in Touch</h1>
            <p>Have a custom corporate request or venue question? Send us a message and we will get back to you within 24 hours.</p>
            <br>
            <form action="https://formsubmit.co/office@vibe360.co.uk" method="POST" id="contact-form">
                    <input type="hidden" name="_subject" value="New VIBE360 Contact Message">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_autoresponse" value="Thank you for contacting VIBE360. We will get back to you within 24 hours.">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" name="name" id="name" placeholder="Jane Smith" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email" placeholder="jane@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="5" placeholder="Tell us about your event..." required></textarea>
                </div>
                <button type="submit" class="btn btn-accent" style="width: 100%;">
                    <i class="fa-solid fa-paper-plane"></i>&nbsp; Send Message
                </button>
            </form>
        </div>
    </div>

        <!-- Footer (email-first contact, no phone numbers) -->
    <div id="site-footer"></div>
    <script src="/js/site-shell.js" defer></script>
</body>
</html>
